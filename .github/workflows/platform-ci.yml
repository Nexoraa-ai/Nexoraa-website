name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Type-check and build platform
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SUPABASE_URL: https://example.supabase.co
      ANTHROPIC_API_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      N8N_WEBHOOK_BASE_URL: http://localhost:5678
      N8N_WEBHOOK_SECRET: ci-placeholder
      APIFY_API_KEY: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check platform
        run: pnpm --filter @neuralforge/platform type-check

      - name: Build platform
        run: pnpm --filter @neuralforge/platform build
